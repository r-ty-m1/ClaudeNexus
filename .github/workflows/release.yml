name: Release

# 推送 v* 標籤（例如 v1.1.0）時，自動打包 zip 與 Setup.exe 並建立 GitHub Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip and installer exe
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $name = "ClaudeNexus-$tag-windows"
          New-Item -ItemType Directory "dist/$name" | Out-Null
          Copy-Item ClaudeNexus.ps1, ClaudeNexus.vbs, install.ps1, statusline.ps1, LICENSE "dist/$name"
          Copy-Item release/*.bat, release/README.txt "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          ./release/build-exe.ps1 -Out "dist/ClaudeNexus-$tag-Setup.exe"
          Get-ChildItem dist -File | Format-Table Name, Length
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @files --title "Claude Nexus $env:GITHUB_REF_NAME" --notes-file release/NOTES.md
